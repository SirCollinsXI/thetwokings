  <title id="title">Pfirsich mit gefurchtem Stein</title>
  <desc id="desc">Ein rundlicher rotgelber Pfirsich mit feinem Flaum und eine aufgeschnittene Hälfte mit gelbem Fruchtfleisch. Der große braune Stein hat tiefe, unregelmäßige Furchen.</desc>
