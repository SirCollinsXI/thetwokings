try{const s=JSON.parse(localStorage.getItem(KEY));if(valid(s))state=s}catch{}
function t(k){return TEXT[state.ui][k]||k}function notice(s){$('#notice').textContent=s;if($('.feedback')&&s)$('.feedback').textContent=s}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notice(t('nostorage'))}}
function recordKey(w,m=mode(),l=state.target){return w.id+':'+l+(m==='picture'?'':':'+m)}function record(w){if(mode()!=='mixed')return state.records[recordKey(w)];const rs=['articles','plural','singular','pronouns'].map(m=>state.records[recordKey(w,m)]).filter(Boolean);return rs.length?{attempts:rs.reduce((a,r)=>a+r.attempts,0),correct:rs.reduce((a,r)=>a+r.correct,0),due:Math.min(...rs.map(r=>r.due))}:undefined}function mode(){return $('#mode').value||'translate'}function pool(){return WORDS.filter(w=>($('#category').value==='all'||w.cat===$('#category').value)&&(!searchText||normalized([w.de,w.en,w.zh,w.pinyin].join(' ')).includes(normalized(searchText))))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function apply(){document.documentElement.lang=state.ui==='zh'?'zh-Hans':state.ui;$('#ui').value=state.ui;$('#target').value=state.target;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));const m=mode();$('#mode').innerHTML=MODES.filter(k=>state.target==='de'||!GERMAN_MODES.includes(k)).map(k=>`<option value="${k}">${t(k)}</option>`).join('');$('#mode').value=(state.target!=='de'&&GERMAN_MODES.includes(m))?'picture':m;const c=$('#category').value||'all';$('#category').innerHTML=CATEGORIES.map(k=>`<option value="${k}">${t(k)}</option>`).join('');$('#category').value=c;if($('#source').value===state.target)$('#source').value=state.target==='zh'?'de':'zh';settingsUI();stats();browse()}

function detail(w){$('#content').innerHTML=`<div class="word-details"><div class="detail-top"><button class="secondary" id="back">${t('back')}</button><span class="pill">${t(w.cat)}</span></div>${image(w)}<div class="translations">${['de','en','zh'].map(l=>`<div lang="${l}"><small>${{de:'DEUTSCH',en:'ENGLISH',zh:'中文 · MANDARIN'}[l]}</small><strong>${w[l]}</strong><small>${l==='de'?w.plural:l==='zh'?w.pinyin:' '}</small><button class="audio" data-say="${l}">▷ ${t('listen')}</button></div>`).join('')}</div>${w.sde?`<div class="sentence"><div lang="de">${w.sde}</div><div lang="en">${w.sen}</div><div lang="zh">${w.szh}</div></div>`:''}<p>${wordStage(w)}</p><label for="memo">${t('memo')}</label><textarea id="memo" maxlength="600">${escapeText(meta.notes[w.id]||'')}</textarea><button class="secondary" id="save-memo">${t('saveMemo')}</button><button class="primary" id="practice">${t('practiceWord')}</button></div>`;$('#save-memo').onclick=()=>{meta.notes[w.id]=$('#memo').value;saveMeta();notice(t('memoSaved'))};$('#back').onclick=browse;$('#practice').onclick=()=>{start(false,[question(w,mode()==='translate'||!w.picture?'translate':mode())])};document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(w[b.dataset.say],b.dataset.say))}

function question(w,m){let solution=w[state.target],prompt=t('prompt'),clue='',explanation='',options=null;
if(m==='articles'){solution=w.de.split(' ')[0];prompt=t('articlePrompt');clue=w.de.replace(/^\S+ /,'');explanation=t('articleExplain')+' '+w.de;options=['der','die','das']}

function makeQuestions(m,review){const count=Number($('#length').value)||8,modes=m==='mixed'?['articles','plural','singular','pronouns']:[m];let groups=modes.map(type=>{let available=eligible(type).filter(w=>{const r=state.records[recordKey(w,type)];return !review||(r&&r.due<=Date.now())});if(!review){const due=shuffle(available.filter(w=>{const r=state.records[recordKey(w,type)];return r&&r.due<=Date.now()})),other=shuffle(available.filter(w=>!due.includes(w)));available=[...due,...other]}return available.slice(0,m==='mixed'?Math.ceil(count/4):count).map(w=>question(w,type))});return shuffle(groups.flat()).slice(0,count)}

function sessionTotals(q){const scored=q.answers.filter(a=>a.m!=='recall');return {correct:scored.filter(a=>a.ok&&!a.skipped&&!a.assisted).length,wrong:scored.filter(a=>!a.ok&&!a.skipped).length,skipped:q.answers.filter(a=>a.skipped).length,assisted:q.answers.filter(a=>a.assisted&&!a.skipped&&a.m!=='recall').length,rated:q.answers.filter(a=>a.m==='recall'&&!a.skipped).length}}

$('#hint').onclick=()=>{q.assisted=true;$('#hint-text').textContent=t('hintLabel')+' '+q.solution.slice(0,Math.min(3,q.solution.length))+'…';$('#hint').disabled=true};$('#exit').onclick=()=>complete(false);if(m==='hearing')$('#play').onclick=()=>{const active=quiz,index=quiz.i;say(q.solution,state.target,()=>{if(quiz===active&&quiz.i===index&&!quiz.answered)document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=false)})};
if(m==='recall'){$('#reveal').onclick=()=>{$('#solution').hidden=false;$('#reveal').hidden=true};$('#knew').onclick=()=>answer(q.solution,true);$('#forgot').onclick=()=>answer(t('forgot'),false)}else if(m==='typing')$('#type-form').onsubmit=e=>{e.preventDefault();answer($('#typed').value)};else document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(q.options[Number(b.dataset.choice)].value));$('#skip').onclick=()=>answer('',false,true);$('#next').onclick=()=>{if(++quiz.i===quiz.questions.length)complete(true);else renderQuestion()}}
function acceptedSolutions(q){return q.w.articleVariants?.length&&state.target==='de'?[q.solution,...q.w.articleVariants.map(a=>a+' '+q.w.de.replace(/^\S+ /,''))]:[q.solution]}
function normalized(s){return s.normalize('NFC').trim().replace(/\s+/g,' ').toLocaleLowerCase()}
function answer(value,self,skipped=false){if(!quiz||quiz.answered)return;const q=quiz.questions[quiz.i];quiz.answered=true;const ok=!skipped&&(typeof self==='boolean'?self:q.m==='typing'?acceptedSolutions(q).some(x=>normalized(value)===normalized(x)):value===q.solution);
quiz.answers.push({id:q.w.id,m:q.m,prompt:q.clue||q.w[state.target],given:value,solution:q.solution,explanation:q.explanation,ok,skipped,assisted:q.assisted,ms:Date.now()-quiz.questionStarted});
const key=recordKey(q.w,q.m,quiz.target),r=state.records[key]||{attempts:0,correct:0,streak:0,due:0};r.attempts++;r.correct+=ok?1:0;r.streak=ok&&!q.assisted?r.streak+1:0;r.due=Date.now()+(ok&&!q.assisted?[1,3,7,14,30][Math.min(r.streak-1,4)]*86400000:300000);state.records[key]=r;updateEvidence(q,ok,skipped);state.days[day()]=(state.days[day()]||0)+1;save();stats();document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;const choice=q.options[Number(b.dataset.choice)].value;if(choice===q.solution)b.classList.add('correct');else if(choice===value)b.classList.add('wrong')});['knew','forgot','skip','typed','reveal','hint'].forEach(id=>{if($('#'+id))$('#'+id).disabled=true});if($('#type-form button'))$('#type-form button').disabled=true;$('.feedback').textContent=(skipped?t('skip'):ok?(q.m==='recall'?t('knew'):t('correct')):t('wrong'))+' · '+q.solution+(q.explanation?' — '+q.explanation:'');$('#session-strip').innerHTML=sessionStrip(quiz);$('#next').hidden=false}
function topicOverview(){if(mode()==='pronouns')return '';return `<details class="topic-overview"><summary>${t('topics')} · ${t(mode())}</summary><p>${t('progressNote')}</p><div class="topic-grid">${CATEGORIES.filter(x=>x!=='all').map(cat=>{const words=eligible(mode()).filter(w=>w.cat===cat),rs=words.map(record).filter(Boolean),n=rs.reduce((a,r)=>a+r.attempts,0),c=rs.reduce((a,r)=>a+r.correct,0);return `<div><strong>${t(cat)}</strong><p>${rs.length} / ${words.length} · ${n?Math.round(100*c/n)+'%':'—'}</p><progress max="${words.length}" value="${rs.length}" aria-label="${t(cat)}"></progress></div>`}).join('')}</div></details>`}
function complete(finished=true){if(!quiz)return;const q=quiz;q.ended=Date.now();const n=sessionTotals(q),scored=n.correct+n.wrong+n.skipped+n.assisted,accuracy=scored?Math.round(n.correct/scored*100):null;finishMeta(q);lockSession(false);$('#content').innerHTML=`<div class="quiz session-result"><p class="eyebrow">${t(finished?'completed':'aborted')}</p><h2>${t('sessionTitle')}</h2>${sessionStrip(q)}<p>${t('assisted')}: ${q.answers.filter(a=>a.assisted).length} · ${t('independentNote')}</p><p>${q.answers.length} / ${q.questions.length} ${t('questions')} · ${t('unanswered')}: ${q.questions.length-q.answers.length}${q.mode!=='recall'&&accuracy!==null?' · '+t('accuracy')+': '+accuracy+'%':''}</p><p class="local-note">${t('sessionNote')}</p><div class="session-actions"><button class="primary" id="again">${t('again')}</button><button class="secondary" id="retry" ${q.answers.some(a=>!a.ok||a.assisted)?'':'disabled'}>${t('retry')}</button><button class="secondary" id="browse">${t('browse')}</button></div><button class="secondary" id="share-session">${t('share')}</button><textarea id="share-copy" readonly hidden aria-label="${t('share')}"></textarea><div class="answer-list">${q.answers.map(a=>`<article class="answer-row ${a.ok?'ok':'miss'}"><span class="pill">${t(a.m)}</span><strong>${escapeText(a.prompt)}</strong><p>${a.assisted?t('assisted')+' · ':''}${t('yourAnswer')}: ${escapeText(a.skipped?t('skip'):a.given)} · ${t(a.m==='recall'?'self':a.skipped?'skipCount':a.ok?'correctCount':'wrongCount')}</p><p>${t('solutionLabel')}: <b>${escapeText(a.solution)}</b></p>${a.explanation?`<p>${escapeText(a.explanation)}</p>`:''}</article>`).join('')}</div></div>`;quiz=null;$('#share-session').onclick=()=>shareSession(q);$('#again').onclick=()=>start(false);$('#browse').onclick=browse;$('#retry').onclick=()=>{const qs=q.answers.filter(a=>!a.ok||a.assisted).map(a=>question([...WORDS,...PRONOUNS].find(w=>w.id===a.id),a.m));state.target=q.target;$('#target').value=q.target;start(false,qs)};}
$('#source').onchange=()=>{if($('#source').value===state.target)$('#source').value=state.target==='zh'?'de':'zh';browse()};$('#length').onchange=e=>{settingsLength=Number(e.target.value)};$('#goal').onchange=e=>{meta.goal=Number(e.target.value);saveMeta();browse()};$('#ui').onchange=e=>{state.ui=e.target.value;save();apply()};$('#target').onchange=e=>{state.target=e.target.value;save();apply()};$('#category').onchange=()=>{page=0;stats();browse()};$('#mode').onchange=()=>{stats();browse()};$('#start').onclick=()=>start(false);$('#review').onclick=()=>start(true);$('#home').onclick=e=>{e.preventDefault();if(quiz)complete(false);else browse()};$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({...state,learning:meta},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='wilson-progress-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice(t('saved'))};$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error();const s=JSON.parse(await f.text());if(!valid(s))throw Error();if(s.learning&&!validMeta(s.learning))throw Error();if(s.learning){meta=s.learning;saveMeta()}state={version:s.version,ui:s.ui,target:s.target,records:s.records,days:s.days};save();apply();notice(t('imported'))}catch{notice(t('badfile'))}e.target.value=''};apply();
</script></body></html>
