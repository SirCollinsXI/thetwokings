name: Comic reader on mobile
on:
  pull_request:
    paths:
      - 'comic*.html'
      - 'comic*.js'
      - 'comic*.json'
      - 'comic*.css'
      - 'comic/**'
      - 'play-i18n.*'
      - 'style.css'
      - 'scripts/test-comic-mobile.cjs'
      - 'scripts/test-comic-workshop.cjs'
      - 'monster-saga*'
      - 'scripts/test-monster-saga.cjs'
      - '.github/workflows/comic-mobile.yml'
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the comic on a touch viewport
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/comic-test" playwright-core@1.56.1
          export NODE_PATH="$RUNNER_TEMP/comic-test/node_modules"
          export COMIC_SCREENSHOTS="$RUNNER_TEMP/comic-screenshots"
          export CHROME="$(command -v google-chrome)"
          export COMIC_TEST_URL="https://thetwokings.de/comic"
          for _ in {1..18}; do
            if curl --fail --silent --show-error --location 'https://thetwokings.de/monster-saga' -o "$RUNNER_TEMP/monster.html" && grep -Fq 'id="saga-reader"' "$RUNNER_TEMP/monster.html"; then break; fi
            sleep 4
          done
          grep -Fq 'id="saga-reader"' "$RUNNER_TEMP/monster.html"
          node scripts/test-live-entrypoints.cjs
          node scripts/test-comic-mobile.cjs
          node scripts/test-comic-workshop.cjs
          node scripts/test-monster-saga.cjs
      - name: Save the mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-mobile
          path: ${{ runner.temp }}/comic-screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore
