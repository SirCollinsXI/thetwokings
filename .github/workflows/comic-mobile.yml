name: Comic reader on mobile
on:
  pull_request:
    paths:
      - 'comic*.html'
      - 'comic*.js'
      - 'comic*.json'
      - 'comic*.css'
      - 'comic/**'
      - 'play-i18n.*'
      - 'style.css'
      - 'scripts/test-comic-mobile.cjs'
      - '.github/workflows/comic-mobile.yml'
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the comic on a touch viewport
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/comic-test" playwright-core@1.56.1
          export NODE_PATH="$RUNNER_TEMP/comic-test/node_modules"
          export COMIC_SCREENSHOTS="$RUNNER_TEMP/comic-screenshots"
          export CHROME="$(command -v google-chrome)"
          export COMIC_TEST_URL="https://thetwokings.de/comic"
          curl --fail --silent --show-error --location --retry 3 https://thetwokings.de/ --output "$RUNNER_TEMP/home.html"
          curl --fail --silent --show-error --location --retry 3 https://thetwokings.de/comics --output "$RUNNER_TEMP/comics.html"
          grep -Fq 'Zu Sams Comics' "$RUNNER_TEMP/home.html"
          grep -Fq '16 illustrierte Seiten.' "$RUNNER_TEMP/comics.html"
          grep -Fq 'Leseprobe öffnen' "$RUNNER_TEMP/comics.html"
          curl --fail --silent --show-error --location --retry 3 https://thetwokings.de/comic/page-11-ankunft.webp --output "$RUNNER_TEMP/strand.webp"
          echo '8640e3b63bc2159334ffff9f754e0c85cae6c907663ff97ad000193d0eb3e7fb  strand.webp' | (cd "$RUNNER_TEMP" && sha256sum -c -)
          echo "Live homepage, collection and beach illustration verified on thetwokings.de"
          node scripts/test-comic-mobile.cjs
      - name: Save the mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-mobile
          path: ${{ runner.temp }}/comic-screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore
