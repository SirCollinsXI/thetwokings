name: Wilson Trainer Checks
on:
  pull_request:
    paths:
      - 'wilson*'
      - 'scripts/*wilson*'
      - 'wilson/**'
      - 'wilson.html'
      - 'index.html'
      - 'i18n-home.js'
      - 'wilson.js'
      - 'wilson.css'
      - 'style.css'
      - '_redirects'
      - 'scripts/test-wilson-input.cjs'
      - 'scripts/test-wilson-cta.cjs'
      - '.github/workflows/wilson-checks.yml'
  push:
    branches:
      - main
      - feature/wilson-picture-input-srs
      - feature/wilson-recovered-*
    paths:
      - 'wilson*'
      - 'wilson/**'
      - 'scripts/*wilson*'
      - '.github/workflows/wilson-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check website assets and scripts
        run: node scripts/check-site.mjs
      - name: Test Wilson input and scheduling
        run: node scripts/test-wilson-input.cjs
      - name: Verify shared vocabulary, exclusions and credits
        run: node scripts/test-wilson-vocabulary.cjs
      - name: Test CTA cache fallbacks and multilingual labels
        run: node scripts/test-wilson-cta.cjs
      - name: Smoke-test mobile browser rendering
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/wilson-server.log 2>&1 &
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME" || { echo "Chrome not found on runner"; exit 1; }
          DOM="$("$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=2500 --dump-dom http://127.0.0.1:8765/wilson-input.html 2>/dev/null)"
          grep -Fq 'id="round-note">新单词' <<< "$DOM" || { echo "Wilson trainer did not initialize"; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=2000 --screenshot="$RUNNER_TEMP/wilson-mobile.png" http://127.0.0.1:8765/wilson-input.html >/dev/null 2>&1
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1280,850 --virtual-time-budget=2000 --screenshot="$RUNNER_TEMP/wilson-desktop.png" http://127.0.0.1:8765/wilson-input.html >/dev/null 2>&1
          test -s "$RUNNER_TEMP/wilson-mobile.png"
          test -s "$RUNNER_TEMP/wilson-desktop.png"
      - name: Verify localized navigation and challenge on mobile
        run: |
          CHROME="$(command -v google-chrome || command -v chromium)"
          for lang in de en zh; do
            case "$lang" in
              de) label='Wilsons Deutsch-Lernecke'; home_label='Wilsons Lernecke' ;;
              en) label='Wilson’s German Learning Corner'; home_label='Wilson’s Learning Corner' ;;
              zh) label='Wilson 的德语学习角'; home_label='Wilson 的学习角' ;;
            esac
            DOM="$("$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=4000 --dump-dom "http://127.0.0.1:8765/index.html?lang=$lang" 2>/dev/null)"
            grep -Fq "$home_label" <<< "$DOM" || { echo "Missing homepage navigation: $lang"; exit 1; }
            HOMEPAGE_LABEL="$home_label" PAGE_LANG="$lang" node -e '
              const html = require("node:fs").readFileSync(0, "utf8");
              const origin = "http://127.0.0.1:8765";
              const lesson = html.match(/<section\b[^>]*\bid="lernen"[^>]*>([\s\S]*?)<\/section>/)?.[1];
              if (!lesson || !lesson.match(/<h2\b[^>]*>[\s\S]*?<\/h2>/)?.[0].includes(process.env.HOMEPAGE_LABEL)) {
                throw new Error("Missing localized Wilson tile title: " + process.env.PAGE_LANG);
              }
              const area = id => html.match(new RegExp(`<nav\\b[^>]*\\bid="${id}"[^>]*>([\\s\\S]*?)</nav>`))?.[1];
              for (const block of [area("navigation"), area("projekte"), lesson, html.match(/<footer\b[^>]*>([\s\S]*?)<\/footer>/)?.[1]]) {
                const tag = block?.match(/<a\b[^>]*\bdata-link-language="home-only"[^>]*>/)?.[0];
                const href = tag?.match(/\shref="([^"]+)"/)?.[1];
                if (!href) throw new Error("Wilson link missing in navigation, projects, learning tile or footer");
                const url = new URL(href.replaceAll("&amp;", "&"), origin);
                if (url.origin !== origin || !/^\/wilson(?:\.html)?$/.test(url.pathname)
                    || ["lang", "homeLang"].some(key => url.searchParams.get(key) !== process.env.PAGE_LANG)
                    || url.searchParams.get("from") !== "homepage") throw new Error("Invalid Wilson link: " + url);
              }
            ' <<< "$DOM"
            LESSON="$("$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=3000 --dump-dom "http://127.0.0.1:8765/wilson.html?lang=$lang" 2>/dev/null)"
            grep -Fq "data-t=\"cornerTitle\">$label</h1>" <<< "$LESSON" || { echo "Wilson entry did not retain $lang"; exit 1; }
            grep -Fq "href=\"wilson-input.html?lang=$lang\"" <<< "$LESSON" || { echo "Trainer language link missing: $lang"; exit 1; }
          done
          WILSON="$("$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:8765/wilson.html' 2>/dev/null)"
          grep -Fq '章鱼哥的德语单复数挑战' <<< "$WILSON" || { echo 'Chinese Challenge title not displayed'; exit 1; }
          grep -Fq '看图输入：冠词＋单数、复数' <<< "$WILSON" || { echo 'Chinese challenge explanation missing'; exit 1; }
          grep -Fq 'href="wilson-input.html?lang=zh"' <<< "$WILSON" || { echo 'Challenge link missing'; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=2500 --screenshot="$RUNNER_TEMP/wilson-chinese-entry.png" 'http://127.0.0.1:8765/wilson.html' >/dev/null 2>&1
          test -s "$RUNNER_TEMP/wilson-chinese-entry.png"
      - name: Test visual learning cues in German, English and Chinese
        run: |
          npm install --prefix "$RUNNER_TEMP/wilson-browser" --no-audit --no-fund playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/wilson-browser/node_modules" CHROME="$(command -v google-chrome)" node scripts/test-wilson-learning-cues.cjs
      - name: Archive responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilson-browser-previews
          path: |
            ${{ runner.temp }}/wilson-mobile.png
            ${{ runner.temp }}/wilson-desktop.png
            ${{ runner.temp }}/wilson-chinese-entry.png
          if-no-files-found: ignore

  published:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the gallery count and a trainer card on the public domain
        run: node scripts/check-wilson-published.cjs

      - name: Verify learning cues on the public domain in isolated browser profiles
        env:
          WILSON_ORIGIN: https://thetwokings.de
        run: |
          npm install --prefix "$RUNNER_TEMP/wilson-browser" --no-audit --no-fund playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/wilson-browser/node_modules" CHROME="$(command -v google-chrome)" node scripts/test-wilson-learning-cues.cjs
